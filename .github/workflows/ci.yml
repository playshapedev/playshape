name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    env:
      # Tests don't launch Electron, so skip the ~100MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `nuxt prepare`, which generates the .nuxt types and
      # ESLint config that lint and typecheck depend on.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| Metric | Coverage |\n|---|---|\n' + ['lines','statements','functions','branches'].map(k => '| ' + k + ' | ' + t[k].pct + '% |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
